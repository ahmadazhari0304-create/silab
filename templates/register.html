{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SILAB</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e6fffa;
            background-image: none;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .auth-card {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-top: 0;
            color: #2A2A2E;
            font-weight: 800;
            font-size: 28px;
        }

        .auth-card p {
            color: #8a857e;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2A2A2E;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #eae6df;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #249D8F;
            box-shadow: 0 0 0 3px rgba(36, 157, 143, 0.2);
        }

        .btn-submit {
            background: #249D8F;
            color: #ffffff;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #1B7A6E;
        }

        .flash-messages {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .flash-messages li {
            background: #ff6b6b;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .auth-links {
            margin-top: 24px;
            font-size: 13px;
            color: #8a857e;
        }

        .auth-links a {
            color: #2A2A2E;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2>SILAB</h2>
        <p>Daftar akun baru</p>

        {% if messages %}
        <ul class="flash-messages">
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form action="{% url 'register' %}" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Pilih username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Buat password">
            </div>
            <button type="submit" class="btn-submit">Daftar</button>
        </form>

        <div class="auth-links">
            Sudah punya akun? <a href="{% url 'login' %}">Log In di sini</a>
        </div>
    </div>
</body>

</html>
